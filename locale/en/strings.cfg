[recipe-description]
sae-scrap-remelting=Remelt Scrap into a bulk molten stream, using imported Vulcanus Calcite as a flux. An alternative to recycling Scrap into manufactured components.
sae-separate-molten-scrap=Electromagnetically separate Molten Scrap into ferrous and non-ferrous streams.
sae-ferrous-refinement=Refine the ferrous stream back into standard Molten Iron.
sae-non-ferrous-separation=Separate the non-ferrous stream into Molten Copper and a Holmium-rich Residue.
sae-holmium-extraction=Extract a small amount of Holmium Ore from Holmium-rich Residue.
sae-copper-foil=Cast Molten Copper and a small amount of Molten Iron directly into a foil suited to electromagnetic electronics production.
sae-electromagnetic-electronic-circuit=An alternative Electronic Circuit recipe using Copper Foil in place of Copper Cable.
sae-electromagnetic-advanced-circuit=An alternative Advanced Circuit recipe using Copper Foil in place of Copper Cable.
sae-electromagnetic-processing-unit=An alternative Processing Unit recipe trading some of its Electronic Circuit input for Copper Foil.
sae-catalyst-rod=Combine Holmium Ore, Copper Foil and surplus Iron Plate into a reusable electromagnetic catalyst.
sae-resonant-circuit=Combine a Processing Unit and Copper Foil using a Catalyst Rod as a one-time catalyst, producing a Resonant Circuit alongside a spent Depleted Catalyst Rod and Contaminated Sulfuric Acid.
sae-purify-contaminated-sulfuric-acid=Neutralise Contaminated Sulfuric Acid with Calcite, recovering usable Sulfuric Acid and Steam.
sae-magmatic-core=Forge a Magmatic Core from Vulcanus Lava and Tungsten Plate, consuming a Catalyst Rod shipped in from Fulgora as a catalyst, and returning a Depleted Catalyst Rod that ships back for reprocessing.
sae-depleted-catalyst-rod-reprocessing=Reprocess spent Depleted Catalyst Rods returned from Vulcanus back into Holmium Ore, at a reduced yield compared to fresh Holmium-rich Residue extraction.
sae-thermionic-assembly=Fuse a Resonant Circuit with a Magmatic Core into the capstone Thermionic Assembly, craftable anywhere.
sae-quench-turbine=Assemble two Thermionic Assemblies into a Quench Turbine, a space-platform generator that runs on Quench Vapour.
sae-lean-quench=Quench a Magmatic Core with Ice into a small amount of very hot Quench Vapour. The turbine cannot use vapour above 315 degrees, so most of the core's energy is thrown away.
sae-cryogenic-quench=Quench a Magmatic Core with Ice and Quench Coolant, producing far more Quench Vapour at exactly the temperature the turbine can use. Returns the coolant spent.
sae-radiative-coolant-cooling=Radiate heat from Spent Quench Coolant into vacuum, returning it cold. Only possible in space.
sae-quench-coolant=Convert Aquilo's Fluoroketone into the Quench Turbine's own coolant. Ships up to a platform in barrels as the loop's initial fill.

