[entity-description]
sae-superconducting-store=A superconducting ring that stores a large amount of energy and releases it quickly.
sae-radiant-generator=Turns radiance into electric energy.
sae-vent-pump=Pumps molten fluid up from deep in a vent. Needs a second fluid to drive it.
sae-drop-crusher=Lifts a heavy weight and drops it, crushing whatever lies beneath.
sae-ballast-drill=A heavy drill driven into the ground by its own ballast. Depletes resources at a reduced rate.
sae-reaction-plant=Reacts fluids together to precipitate a solid.
sae-vacuum-furnace=A sealed furnace that smelts with the air pumped out.
sae-gas-pump=Draws gas from a vent under the vent's own pressure. Needs no power.
sae-crust-turbine=Burns gas in its combustion chamber to create electric energy.
sae-radiant-asteroid=An asteroid found past the Shattered Planet.
sae-core-boulder=A rock that can be mined by hand.
sae-obsidian=Volcanic glass. Found only on Vulcanus.
sae-ozone-collector=Catches lightning and turns it into a gas instead of electric energy.
sae-induction-foundry=A foundry that heats its melt by induction. Allows induction recipes and richer foundry casts.
sae-magnetic-collector=An asteroid collector with magnetic arms that reach further and move faster.

