[entity-description]
sae-superconducting-store=Half a gigajoule, and it will take twenty megawatts at once. Built for a sky that pays in lumps.
sae-radiant-generator=Ten megawatts from radiant cells, fifty seconds a cell, and each one handed back spent.
sae-vent-pump=Draws molten kamacite from a kamacite vent. Needs helium-3 to lift it: the scarce vent pays for the rich one.
sae-drop-crusher=Breaks ore under its own weight. Needs gravity, so it works here and nowhere else.
sae-ballast-drill=A heavy drill that uses its own weight to mine. Depletes resources at a reduced rate.
sae-reaction-plant=Solution in one port, vent gas in the other, and a cell out on the belt. The planet's whole power supply runs through it.
sae-vacuum-furnace=No air to lose the powder into. The only furnace that will take the crusher's fines.
sae-gas-pump=Draws gas from the vent it stands on, and needs no power to do it. It will not stand anywhere else.
sae-crust-turbine=Burns the siderane a gas pump draws, at any temperature at all.
sae-radiant-asteroid=The one rock the far field still offers. Shoot it and collect what it drops; anything else destroys it outright.
sae-core-boulder=A piece of the crust, lying where the shattering dropped it. The only ore here you can get without a drill, and there are only so many.
sae-obsidian=Volcanic glass, cooled too fast to crystallise. Any drill will take it.
sae-ozone-collector=Each lightning strike it takes adds 100 ozone, and it holds 1,000. It keeps none of the strike's power.
sae-induction-foundry=A foundry's equal, run on 4 MW. It crafts only induction recipes: molten holmium iron, the field core, magnetar alloy and five foundry casts that each take an extra ingredient.
sae-magnetic-collector=Twice the asteroid collector's reach and almost three times its arm speed, for four times the power per arm move. It takes every chunk, magnetic ones included.

