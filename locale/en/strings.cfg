[technology-description]
sae-core-discovery=A dense planet past the Shattered Planet, with an atmosphere of its own and the strongest gravity in the system.
sae-fa-cryogen=Chemistry that only works when it is kept cold.
sae-fa-fluorinated-holmium=Fulgora's metal, worked in Aquilo's chemistry.
sae-fa-superconducting-winding=Wind a conductor that loses nothing, and store energy in it.
sae-core-survey=Find the Core's ore, and a drill heavy enough to mine it.
sae-crust-tapping=Draw gas from the Core's vents and burn it for power.
sae-gravity-crushing=Let the Core's gravity crush the ore.
sae-vacuum-sintering=Smelt in a sealed furnace with the air pumped out.
sae-vent-tapping=Pump molten fluid up from deep in the Core's vents.
sae-radiant-power=Turn radiance into fuel, and fuel into power.
sae-vf-obsidian-mining=Mine volcanic glass on Vulcanus.
sae-vf-obsidian-flux=Make a flux from volcanic glass.
sae-vf-fluxed-steel=Cast steel with flux, so the melt goes further.
sae-vf-refined-molten-iron=Refine molten metal clean enough to hold a field.
sae-vf-ozone-capture=Capture lightning as a gas.
sae-vf-holmium-oxide=Get more out of Fulgora's metal.
sae-vf-oxide-superconductor=A cheaper way to make superconductors.
sae-vf-superconducting-coil=Wind superconducting coils that can leave Fulgora.
sae-vf-induction-foundry=A foundry that heats its melt by induction.
sae-vf-magnetar-alloy=Charge an alloy in a magnetic field.
sae-vf-magnetite-rounds=Railgun rounds for the biggest asteroids.

