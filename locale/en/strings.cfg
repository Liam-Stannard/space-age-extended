[recipe-description]
sae-cryogen-recovery=Spent cryogen, made cold again. It costs ammonia, so it happens where the ammonia is.
sae-fluorinated-holmium=Holmium shipped out to meet a fluid that cannot come to it.
sae-superconducting-winding=And shipped back again, to meet one that cannot leave either.
sae-radiant-crushing=What the field gives you if you take it as it is.
sae-seeded-crushing=What it gives you if you sowed first.
sae-gravity-settling=Let the melt stand under fifty gravities and the dross sinks out of it. Most of the heat stays in the metal.
sae-quenched-settling=The same vessel, run cold: far less metal, and a great deal of steam.
sae-orbital-homogenisation=Alloyed evenly, because in orbit there is no down for anything to settle towards.
sae-cold-welding=In vacuum, clean metal bonds on contact. It cannot be hurried, and it costs almost no power.
sae-superconducting-winding-stub=Stands in for the Fulgora-Aquilo capstone until that tree exists.
sae-magnetar-alloy-stub=Stands in for the Vulcanus-Fulgora capstone until that tree exists.
sae-cultured-alloy-stub=Stands in for the Vulcanus-Gleba capstone until that tree exists.
sae-bio-polymer-stub=Stands in for the Fulgora-Gleba capstone until that tree exists.
sae-cryoprotectant-stub=Stands in for the Gleba-Aquilo capstone until that tree exists.

