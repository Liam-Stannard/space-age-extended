sae-cold-welding=Cold welding
sae-seed-plate=Seed plate

[recipe-description]
sae-gravity-settling=Let the melt stand under fifty gravities and the dross sinks out of it. Most of the heat stays in the metal.
sae-quenched-settling=The same vessel, run cold: far less metal, and a great deal of steam.
sae-orbital-homogenisation=Alloyed evenly, because in orbit there is no down for anything to settle towards.
sae-cold-welding=In vacuum, clean metal bonds on contact. It cannot be hurried, and it costs almost no power.

