[technology-description]
sae-metallurgical-recovery=Recover bulk metal from Fulgora's Scrap by remelting it with imported Vulcanus Calcite, as an alternative to recycling.
sae-advanced-material-recovery=Separate the non-ferrous stream recovered from Scrap into Molten Copper and a trickle of Holmium.
sae-electromagnetic-metallurgy=Cast Molten Copper directly into Copper Foil, and use it in place of Copper Cable in Electronic and Advanced Circuit production.
sae-integrated-electronics=Extend the Copper Foil substitution to Processing Unit production.
sae-resonant-electromagnetics=The capstone technology: unlocks the Catalyst Rod, Resonant Circuit, Magmatic Core, Depleted Catalyst Rod reprocessing, Sulfuric Acid purification, and the Thermionic Assembly that fuses Fulgora's and Vulcanus's halves of the chain.
sae-thermionic-power=Unlocks the Quench Turbine, a space-platform-only generator, and the Lean Quench recipe that feeds it. Fills the gap between solar and Aquilo-locked fusion, at a steep cost in Magmatic Cores.
sae-cryogenic-quenching=Unlocks the Cryogenic Quench, which extracts roughly seven times the electricity from each Magmatic Core, plus the Quench Coolant it runs on and the radiative cooling that closes that loop in space.

