[technology-description]
sae-core-discovery=The shattered world left a core behind, and it can be reached. Until this is researched, no platform will plot a course there.
sae-fa-cryogen=Every step of this chain drinks cold and hands back warm. Build in loops, not lines.
sae-fa-fluorinated-holmium=Fulgora's metal, in Aquilo's chemistry. Neither world can do it alone and neither fluid will travel.
sae-fa-superconducting-winding=The first capstone: a conductor that loses nothing, and somewhere to keep a surge that arrives faster than anything can spend it.
sae-core-survey=Where the ore is, and a drill heavy enough to take it.
sae-crust-tapping=A gas pump and a turbine. Enough power to begin with, and no more.
sae-gravity-crushing=At fifty g, dropping it is enough.
sae-vacuum-sintering=The crusher's powder is metal too. It only needs a furnace with no air in it.
sae-vent-tapping=The vents carry more than gas.
sae-radiant-power=The pool is not a curiosity, it is the fuel supply. Precipitate it with vent gas and burn it where it was made.
sae-vf-obsidian-mining=Fast-cooled volcanic glass lies in Vulcanus's basalt lowlands, near the lava. Any drill will take it, and a furnace turns it to glass.
sae-vf-obsidian-flux=Lava heats sulfuric acid to 500°, and hot acid turns obsidian glass into flux. Keep the hot line apart from the cold: mixed, they average.
sae-vf-fluxed-steel=Flux carries the impurities out of the melt as slag, so steel takes a third less iron. The slag still has uses.
sae-vf-refined-molten-iron=Molten iron with a fifth of it lost to slag, clean enough to hold a field. Nothing uses it until the induction foundry.
sae-vf-ozone-capture=Ozone comes only with lightning, and it cannot be barrelled.
sae-vf-holmium-oxide=Holmium solution and ozone make more holmium than the solution alone. It stops when the ozone does.
sae-vf-oxide-superconductor=Superconductor from holmium oxide, with no light oil. Cheaper, while the ozone lasts.
sae-vf-superconducting-coil=Superconductor wound in electrolyte, which cannot leave Fulgora. The coil can.
sae-vf-induction-foundry=Where the two worlds meet: Fulgora's coil and oxide, Vulcanus's refined iron.
sae-vf-magnetar-alloy=A field core, charged in the field it was cast in.
sae-vf-magnetite-rounds=Magnetic chunks crush into magnetite, and magnetite makes a railgun round that kills a huge promethium asteroid in one shot. It fires 1.5 times slower.

