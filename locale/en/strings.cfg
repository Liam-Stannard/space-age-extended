[recipe-description]
sae-radiant-precipitation=Helium-3 pulls the isotope out of the solution. The gas is the cost; the pool is not.
sae-cryogen-recovery=Spent cryogen, made cold again. It costs ammonia, so it happens where the ammonia is.
sae-fluorinated-holmium=Holmium shipped out to meet a fluid that cannot come to it.
sae-superconducting-winding=And shipped back again, to meet one that cannot leave either.
sae-magnetar-alloy-stub=Stands in for the Vulcanus-Fulgora capstone until that tree exists.
sae-cultured-alloy-stub=Stands in for the Vulcanus-Gleba capstone until that tree exists.
sae-bio-polymer-stub=Stands in for the Fulgora-Gleba capstone until that tree exists.
sae-cryoprotectant-stub=Stands in for the Gleba-Aquilo capstone until that tree exists.

