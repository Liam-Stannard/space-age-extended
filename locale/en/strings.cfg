[mod-name]
space-age-extended=Space Age Extended

[mod-description]
space-age-extended=Cross-planet production lines between pairs of worlds, ending at the Core of the Shattered Planet.

[space-location-name]
sae-core=The Core

[space-location-description]
sae-core=The intact metallic heart of the shattered world, still out there past the point where every platform turns back. A frozen crust over a hot interior; no air, no water, nothing that ever lived. Everything arrives down the corridor.

[space-connection-name]
sae-shattered-planet-core=Shattered Planet — The Core

[technology-name]
sae-core-discovery=Core discovery

[technology-description]
sae-core-discovery=Confirms that the shattered world left a core behind, and that it can be reached. Without it, no platform can plot a course there.

[fluid-name]
sae-molten-kamacite=Molten kamacite
sae-helium-3=Helium-3

[fluid-description]
sae-molten-kamacite=Metal-bearing melt drawn from a vent. Too hot and too heavy to barrel: whatever the Core exports has to be cast first.
sae-helium-3=Primordial gas, trapped since the world formed. Inert, cold and scarce — and the only thing that will lift melt out of a vent.

[item-name]
sae-kamacite-ore=Kamacite ore

[item-description]
sae-kamacite-ore=The iron-nickel alloy of a planetary core, exposed by the shattering.

