[item-description]
sae-geodynamic-science-pack=The study of planetary interiors and the fields they make. It can only be assembled on the Core, so the tree can only be advanced by a factory actually running there.
sae-field-conductor=Drawn in freefall, where nothing settles out of the alloy while it forms.
sae-magnetic-core-billet=Settled under fifty gravities, then cast around an alloy no single world can make.
sae-reinforced-frame=Grown metal reinforcing an alloy that was itself grown.
sae-insulation-sleeve=Poured hot around the polymer, so it takes the shape of what it will insulate.
sae-coolant-charge=Cold enough to matter, sealed in a shell that will survive the current.
sae-kamacite-ore=The iron-nickel alloy of a planetary core, exposed by the shattering.
sae-dross=What sinks out of the melt under fifty gravities. Ground for beds, or metal you have not finished recovering.
sae-cast-ingot=Cast where weight has already done the sorting. Uneven: the heavy fraction settled while it cooled.
sae-homogenised-ingot=The same ingot, alloyed evenly because in orbit nothing settles out of it.
sae-seed-plate=Plant it on a bed and it grows.
sae-kamacite-whiskers=Metal that crystallised rather than being cast. Grown, harvested, and impossible to hurry.
sae-welded-plate=Two clean surfaces, touched together in vacuum until they forgot they were two.

