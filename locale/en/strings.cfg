[item-description]
sae-fluorinated-holmium=Made only on Aquilo.
sae-radiant-chunk=An asteroid chunk that can be crushed.
sae-radiant-fuel=Fuel for the radiant generator.
sae-spent-cell=Left over after fuel has been used in a radiant generator.
sae-crushed-kamacite=Can be smelted.
sae-kamacite-fines=Can be smelted.
sae-obsidian=Volcanic glass. Found only on Vulcanus.
sae-obsidian-flux=Removes impurities in foundry casts.
sae-slag-aggregate=A by-product of foundry casts that use flux.
sae-holmium-oxide=Made only on Fulgora.
sae-superconducting-coil=Made only on Fulgora.
sae-magnetic-asteroid-chunk=An asteroid chunk found only between Vulcanus and Fulgora. Only the magnetic collector can catch it.
sae-magnetite=Used to make ammunition.
sae-magnetite-round=Used to break the biggest asteroids.

