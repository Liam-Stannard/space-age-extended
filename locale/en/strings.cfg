[recipe-description]
sae-radiant-precipitation=Vent gas pulls the isotope out of the solution. Both halves come out of the ground the factory is standing on.
sae-cryogen-recovery=Spent cryogen, made cold again. It costs ammonia, so it happens where the ammonia is.
sae-fluorinated-holmium=Holmium shipped out to meet a fluid that cannot come to it.
sae-superconducting-winding=And shipped back again, to meet one that cannot leave either.
sae-cultured-alloy-stub=Stands in for the Vulcanus-Gleba capstone until that tree exists.
sae-bio-polymer-stub=Stands in for the Fulgora-Gleba capstone until that tree exists.
sae-cryoprotectant-stub=Stands in for the Gleba-Aquilo capstone until that tree exists.
sae-superheated-sulfuric-acid=Lava heats the acid to 500°. Barrelled, it comes back cold.
sae-obsidian-flux=Needs sulfuric acid at 500° or more.
sae-molten-iron-from-lava-flux=A fifth more molten iron than calcite gives, for one flux a craft.
sae-fluxed-steel=A third less iron per steel. The glass carries the impurities away as slag.
sae-refined-molten-iron=A fifth of the iron goes to slag.
sae-holmium-oxide=A fifth more holmium than the solution alone, paid for in ozone.
sae-oxide-superconductor=No light oil. It stops when the ozone runs out.
sae-magnetar-alloy=Charging is time in the field, nothing else.
sae-induction-molten-copper=Hot sulfuric acid leaches copper out of the rock.
sae-induction-casting-iron=Flux skims the cast clean.
sae-induction-casting-copper=Hot acid pickles the oxide skin off.
sae-induction-casting-iron-gear-wheel=Crushed slag as mould sand.
sae-induction-casting-copper-cable=Flux in the melt means fewer breaks in the draw.

