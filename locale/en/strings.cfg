sae-advanced-material-recovery=Advanced Material Recovery

[technology-description]
sae-metallurgical-recovery=Recover bulk metal from Fulgora's Scrap by remelting it with imported Vulcanus Calcite, as an alternative to recycling.
sae-advanced-material-recovery=Separate the non-ferrous stream recovered from Scrap into Molten Copper and a trickle of Holmium.

