[fluid-description]
sae-radiant-solution=The corridor's isotope, seeped into the crust and pooled in the low ground. Glows because it is dying.
sae-cold-cryogen=Cold enough to make holmium behave. Re-chilling it needs ammonia, and ammonia does not leave Aquilo.
sae-spent-cryogen=Warm, and useless until something cold has been done to it again.
sae-molten-kamacite=Metal-bearing melt drawn from a vent. Too hot and too heavy to barrel: whatever the Core exports has to be cast first.
sae-helium-3=Primordial gas, trapped since the world formed. Inert, cold and scarce — and the only thing that will lift molten kamacite out of a vent.
sae-crust-gas=The Core's own gas, held in its iron since the world formed and still under pressure. It burns.
sae-ozone=Made by lightning and nothing else. It has no barrel, so it never leaves Fulgora.
sae-refined-molten-iron=Molten iron with the slag taken out. Too hot to barrel.
sae-molten-holmium-iron=Refined iron with holmium oxide fluxed into it, held in an induction foundry's field. Too hot to barrel.

