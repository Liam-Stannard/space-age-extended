[technology-description]
sae-geodynamic-science=Research that can only be supplied by a factory standing on the thing it studies.
sae-integration-conductor=What Fulgora and Aquilo make together, finished in freefall.
sae-integration-frame=What Vulcanus and Gleba make together, reinforced with metal grown on site.
sae-integration-billet=What Vulcanus and Fulgora make together, cast into settled melt.
sae-integration-sleeve=What Fulgora and Gleba make together, poured around in raw melt.
sae-integration-coolant=What Gleba and Aquilo make together, charged with helium that never left the planet.
sae-field-coils=A coil has five parts, and four worlds' worth of chain behind them.
sae-ignition-array=Everything the Core has been for.
sae-sealed-roboports=Bots have been possible since you landed; a network has not.
sae-arc-masts=The dead field still discharges through the crust. A mast will catch a strike and hold it, which is the difference between weather and a power supply.
sae-core-discovery=Confirms that the shattered world left a core behind, and that it can be reached. Without it, no platform can plot a course there.
sae-core-survey=Where the vents are, and what the ore is worth.
sae-gravity-settling=Fifty gravities will separate a melt on their own, given a tall enough vessel and time. In orbit, the same melt does the opposite.
sae-whisker-beds=Metal grows if you give it ground and leave it alone. The ground is made from what the melt threw away.
sae-cold-welding=Two clean surfaces in vacuum will bond without heat. Slowly.

[fluid-name]
sae-settled-melt=Settled melt
sae-cryoprotectant=Cryoprotectant (placeholder)
sae-molten-kamacite=Molten kamacite
sae-helium-3=Helium-3

[fluid-description]
sae-settled-melt=Melt with the dross gone out of it, which fifty gravities will do on their own given a tall enough vessel.
sae-molten-kamacite=Metal-bearing melt drawn from a vent. Too hot and too heavy to barrel: whatever the Core exports has to be cast first.
sae-helium-3=Primordial gas, trapped since the world formed. Inert, cold and scarce — and the only thing that will lift melt out of a vent.

