[entity-description]
sae-superconducting-store=Half a gigajoule, and it will take twenty megawatts at once. Built for a sky that pays in lumps.
sae-radiant-generator=Burns the only fuel out here, and nothing else will take it. Works in vacuum, which is the point: it is made where it is spent.
sae-ignition-array=A hundred field coil segments, buried in the crust and fired at once. What it restarts is the thing the planet lost.
sae-sealed-roboport=A roboport that holds its own atmosphere. It works here, and nowhere else in the system.
sae-arc-mast=Takes the strike so nothing else does, and banks what it took. Site them for cover first; the power is what you get for standing in the way.
sae-vent-pump=Draws melt from a vent. Needs helium-3 to lift it: the scarce vent pays for the rich one.
sae-bed-tender=Plants seed plates and harvests whatever has finished growing. Works only where the air is thin enough that nothing else does.
sae-core-boulder=A piece of the crust, lying where the shattering dropped it. The only ore here you can get without a drill, and there are only so many.

