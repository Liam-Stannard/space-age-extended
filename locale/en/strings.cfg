[item-description]
sae-radiant-generator=Ten megawatts from the only fuel out here. Nothing else will take that fuel, and it will take nothing else.
sae-vent-pump=Lifts molten kamacite out of a vent, on helium it cannot make itself.
sae-fluorinated-holmium=Holmium that has met fluorine, which can only happen on the world fluorine cannot leave.
sae-superconducting-store=Somewhere to put a surge that arrives faster than anything can spend it.
sae-radiant-chunk=The one rock the far field still offers. Inert until it is crushed, and inert forever if it is shot with the wrong thing.
sae-radiant-fuel=Made where it is burned, from the only material out here. Nothing else travels this far and still works.
sae-spent-cell=A radiant cell that has finished. Nothing will burn it twice, and nothing yet takes it apart — so it piles up wherever the generators are.
sae-kamacite-ore=The iron-nickel alloy of a planetary core, exposed by the shattering.
sae-crushed-kamacite=Ore broken small enough to smelt. The whole plate line starts here.
sae-kamacite-fines=Powder too fine for an open furnace. Only the vacuum furnace will take it.
sae-drop-crusher=Lifts the charge and lets the planet do the work.
sae-ballast-drill=A heavy drill that uses its own weight to mine. Depletes resources at a reduced rate.
sae-reaction-plant=Precipitates the pool's isotope into cells. It will take no other work, and nothing else will take this.
sae-vacuum-furnace=Sealed, so the powder stays in it. The only smelter that takes fines.
sae-gas-pump=Draws whatever gas the vent under it holds. Landing-day power, and not much of it.
sae-crust-turbine=Burns siderane. Temperature does not enter into it.
sae-obsidian=Volcanic glass, cooled too fast to crystallise. Found only on Vulcanus.
sae-obsidian-glass=Smelted like brick.
sae-obsidian-flux=Glass dissolved in hot acid. A little of it in a melt takes the impurities out.
sae-slag-aggregate=What the flux carried out of the iron. It makes concrete and brick, and an induction foundry will take it as mould sand.
sae-holmium-oxide=Holmium, oxidised by ozone. Made on Fulgora; the ozone stays behind.
sae-superconducting-coil=Wound on Fulgora, where the electrolyte is. It ships.
sae-field-core=A superconducting coil in a body of holmium iron, ready to charge.
sae-magnetar-alloy=A field core, charged in the field it was cast in.
sae-ozone-collector=Turns lightning into ozone instead of power.
sae-induction-foundry=Runs no vanilla recipe: only its own field recipes and five casts that each take an extra ingredient for a little more.
sae-magnetic-collector=An asteroid collector with a magnetar alloy arm. Fast enough to catch magnetic chunks.
sae-magnetic-asteroid-chunk=Flies only between Vulcanus and Fulgora, faster than any other chunk. An arm at rest is too slow for it.
sae-magnetite=Crushed from magnetic chunks. Its one use is the magnetite round.
sae-magnetite-round=15,000 damage a shot, fired 1.5 times slower than railgun ammo. For the biggest targets only.

