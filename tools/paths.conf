# Where this machine's Factorio and Blender are: the only place any script
# under tools/ or concept/ learns it, through tools/paths.sh (shell) or
# tools/paths.py (Python). No environment variable or path argument overrides
# it; moving machines means editing this file and nothing else.
#
# One KEY=value a line; a line whose first non-blank character is '#' is a
# comment, and blank lines are fine. The value is the rest of the line after
# '=', with blanks at either end trimmed, taken exactly as written: no quotes,
# no ~, no $VAR, nothing run.
#
# FACTORIO_ROOT  the install folder: the binary is <root>/bin/x64/factorio,
#                the game data <root>/data.
# BLENDER        a Blender 5 binary; blender.org's build, which has the GPU
#                kernels a distro package lacks.
FACTORIO_ROOT=/mnt/data/SteamLibrary/steamapps/common/Factorio
BLENDER=/home/lstan/opt/blender-5.0.1-linux-x64/blender
